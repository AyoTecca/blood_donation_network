services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: blood-oracle-free
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 60
      start_period: 120s

volumes:
  oracle_data:
